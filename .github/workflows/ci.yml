name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot
          POSTGRES_DB: autopilot_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://autopilot:autopilot@localhost:5432/autopilot_scheduler

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint (pyflakes — unused imports, undefined names)
        run: python -m pyflakes app/ seed_data.py tests/smoke_test.py

      - name: Compile check
        run: find app -name "*.py" | xargs python -m py_compile

      - name: Apply schema
        run: psql "$DATABASE_URL" -f ../schema.sql

      - name: Seed demo data
        run: python seed_data.py

      - name: Boot API and run end-to-end smoke test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          python tests/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
